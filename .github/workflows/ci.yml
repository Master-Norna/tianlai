name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Windows portable / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp,dev]"
          python -m pip check
      - name: Test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pytest -q -m "not external_assets and not listening"
      - name: Source-release doctor
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m tianlai.doctor --quick

  linux-portable:
    name: Linux portable onboarding / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux archive tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - name: Bootstrap, first sound and portable tests
        run: |
          bash ./bootstrap_linux.sh \
            --python "$(command -v python)" \
            --portable-tests
      - name: Installed CLI and doctor smoke
        run: |
          .venv/bin/python -m pip check
          .venv/bin/tianlai --version
          .venv/bin/tianlai-doctor --quick

  macos-portable:
    name: macOS source ZIP / ${{ matrix.runner }} / ${{ matrix.architecture }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            machine: arm64
            python-version: "3.11"
            soundfont: false
          - runner: macos-15
            architecture: arm64
            machine: arm64
            python-version: "3.12"
            soundfont: false
          - runner: macos-15
            architecture: arm64
            machine: arm64
            python-version: "3.13"
            soundfont: false
          - runner: macos-15
            architecture: arm64
            machine: arm64
            python-version: "3.14"
            soundfont: true
          - runner: macos-15-intel
            architecture: x64
            machine: x86_64
            python-version: "3.11"
            soundfont: false
          - runner: macos-15-intel
            architecture: x64
            machine: x86_64
            python-version: "3.12"
            soundfont: false
          - runner: macos-15-intel
            architecture: x64
            machine: x86_64
            python-version: "3.13"
            soundfont: false
          - runner: macos-15-intel
            architecture: x64
            machine: x86_64
            python-version: "3.14"
            soundfont: true
          - runner: macos-26
            architecture: arm64
            machine: arm64
            python-version: "3.14"
            soundfont: true
          - runner: macos-26-intel
            architecture: x64
            machine: x86_64
            python-version: "3.14"
            soundfont: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          cache: pip
      - name: Verify native macOS architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          python - <<'PY'
          import os
          import platform
          import struct
          import sys

          expected_machine = os.environ["EXPECTED_MACHINE"]
          expected_python = tuple(
              int(part) for part in os.environ["EXPECTED_PYTHON"].split(".")
          )
          assert platform.system() == "Darwin", platform.system()
          assert platform.machine() == expected_machine, platform.machine()
          assert sys.implementation.name == "cpython", sys.implementation.name
          assert sys.version_info[:2] == expected_python, sys.version
          assert struct.calcsize("P") * 8 == 64
          PY
      - name: Build from the clean Git commit
        run: |
          python tools/build_source_release.py \
            --repo . \
            --output "$RUNNER_TEMP/tianlai-source.zip"
      - name: Extract into a Unicode path and run macOS onboarding
        env:
          TIANLAI_REQUIRE_BSDTAR: "1"
        run: |
          target="$RUNNER_TEMP/天籁 macOS 发布验收"
          mkdir -p "$target"
          python -m zipfile -e "$RUNNER_TEMP/tianlai-source.zip" "$target"
          cd "$target"
          executable="$(python -S ./tianlai/resource_restore.py verify-bsdtar)"
          test -n "$executable"
          printf 'Verified bsdtar executable: %s\n' "$executable"
          /bin/bash -n ./bootstrap_macos.sh
          /bin/bash ./bootstrap_macos.sh \
            --python "$(command -v python)" \
            --portable-tests
          if test "$EXPECTED_MACHINE" = "x86_64"; then
            .venv/bin/python - <<'PY'
          from importlib.metadata import version

          selected = version("cryptography")
          if selected.partition(".")[0] != "48":
              raise SystemExit(
                  "Intel macOS requires the cryptography 48 universal2 line; "
                  f"installed {selected}"
              )
          print(f"Verified Intel-compatible cryptography: {selected}")
          PY
          fi
          test -s "output/首次出声/参考振荡器.wav"
          .venv/bin/python -m pip check
          .venv/bin/tianlai --version
          .venv/bin/tianlai-doctor --quick
      - name: Test optional FluidSynth dylib integration
        if: matrix.soundfont
        env:
          PYTHONUTF8: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          TIANLAI_REQUIRE_NATIVE_FLUIDSYNTH: "1"
        run: |
          target="$RUNNER_TEMP/天籁 macOS 发布验收"
          cd "$target"
          for attempt in 1 2 3; do
            if brew list --versions fluid-synth >/dev/null 2>&1 || brew install fluid-synth; then
              break
            fi
            if test "$attempt" = 3; then
              echo "FluidSynth installation failed after three attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          .venv/bin/python -m pip install --no-build-isolation -e ".[soundfont]"
          .venv/bin/python - <<'PY'
          import importlib.util
          from pathlib import Path

          from tianlai.soundfont import prepare_fluidsynth_runtime

          if importlib.util.find_spec("fluidsynth") is None:
              raise SystemExit("macOS FluidSynth gate requires the Python binding")
          runtime = prepare_fluidsynth_runtime(Path.cwd())
          if runtime is None:
              raise SystemExit("macOS FluidSynth gate requires a discoverable native runtime")
          print(f"Verified FluidSynth Python binding and native runtime: {runtime}")
          PY
          .venv/bin/tianlai-doctor --quick
          .venv/bin/python -m pytest -q \
            tests/test_smoke_soundfont_builder.py \
            -k native_backend_loads_unicode_path_and_renders_nonzero_audio

  source-release-smoke:
    name: Clean source ZIP / Windows
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Build from the clean Git commit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/build_source_release.py `
            --repo . `
            --output "$env:RUNNER_TEMP\tianlai-source.zip"
      - name: Extract into a Unicode path and install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $target = Join-Path $env:RUNNER_TEMP "天籁 发布验收"
          Expand-Archive `
            -LiteralPath "$env:RUNNER_TEMP\tianlai-source.zip" `
            -DestinationPath $target
          Push-Location $target
          try {
            & cmd.exe /d /c "安装运行环境.cmd -SkipSmoke"
            if ($LASTEXITCODE -ne 0) {
              throw "source-package bootstrap failed: $LASTEXITCODE"
            }
            & cmd.exe /d /c "天籁.cmd --version"
            if ($LASTEXITCODE -ne 0) {
              throw "source-package CLI failed: $LASTEXITCODE"
            }
            & cmd.exe /d /c "检查运行环境.cmd --quick"
            if ($LASTEXITCODE -ne 0) {
              throw "source-package doctor failed: $LASTEXITCODE"
            }
            .\.venv\Scripts\python.exe -m pip install -e ".[dev,mcp]"
            .\.venv\Scripts\python.exe -m pytest -q `
              -m "not external_assets and not listening"
            .\.venv\Scripts\python.exe -m pytest -q `
              tests/test_instrument_consistency.py `
              tests/test_public_workflow_smoke.py `
              tests/test_release_metadata.py
          } finally {
            Pop-Location
          }

  source-release-smoke-linux:
    name: Clean source ZIP / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux archive tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - name: Build from the clean Git commit
        run: |
          python tools/build_source_release.py \
            --repo . \
            --output "$RUNNER_TEMP/tianlai-source.zip"
      - name: Extract and run the Linux onboarding contract
        run: |
          target="$RUNNER_TEMP/天籁 Linux 发布验收"
          mkdir -p "$target"
          python -m zipfile -e "$RUNNER_TEMP/tianlai-source.zip" "$target"
          cd "$target"
          bash ./bootstrap_linux.sh \
            --python "$(command -v python)" \
            --portable-tests
          .venv/bin/python -m pip check
          .venv/bin/tianlai --version
          .venv/bin/tianlai-doctor --quick

  engine-wheel-smoke:
    name: Engine wheel / isolated install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel and dependency wheelhouse
        run: |
          wheelhouse="$RUNNER_TEMP/wheelhouse"
          mkdir -p "$wheelhouse"
          python -m pip wheel . --wheel-dir "$wheelhouse"
      - name: Install only from the built wheelhouse
        run: |
          wheelhouse="$RUNNER_TEMP/wheelhouse"
          isolated="$RUNNER_TEMP/engine-wheel"
          package="$(find "$wheelhouse" -maxdepth 1 -name 'tianlai_audio-*.whl' -print -quit)"
          test -n "$package"
          python -m venv "$isolated"
          "$isolated/bin/python" -m pip install \
            --no-index \
            --find-links "$wheelhouse" \
            "$package"
          "$isolated/bin/python" -m pip check
          "$isolated/bin/tianlai" --version
          "$isolated/bin/python" -c \
            "import tianlai.analysis_cache; print('engine wheel import: OK')"
